<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinCalcFree — Financial Calculators</title>
<meta name="description" content="Free financial calculators for mortgage, investment returns, retirement planning, and loan amortization. Plan your financial future with interactive charts.">

<link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,600,700&f[]=cabinet-grotesk@400,500,700,800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<style>
/* ======= ART DIRECTION =======
   Finance calculator app → precision, trust, clarity
   Palette: Nexus teal with custom finance-specific adjustments
   Typography: Cabinet Grotesk (display) + Satoshi (body) — modern finance feel
   ============================== */

:root, [data-theme="light"] {
  --text-xs:   clamp(0.75rem,  0.7rem  + 0.25vw, 0.875rem);
  --text-sm:   clamp(0.875rem, 0.8rem  + 0.35vw, 1rem);
  --text-base: clamp(1rem,     0.95rem + 0.25vw, 1.125rem);
  --text-lg:   clamp(1.125rem, 1rem    + 0.75vw, 1.5rem);
  --text-xl:   clamp(1.5rem,   1.2rem  + 1.25vw, 2.25rem);
  --text-2xl:  clamp(2rem,     1.2rem  + 2.5vw,  3.5rem);

  --space-1:0.25rem;--space-2:0.5rem;--space-3:0.75rem;--space-4:1rem;
  --space-5:1.25rem;--space-6:1.5rem;--space-8:2rem;--space-10:2.5rem;
  --space-12:3rem;--space-16:4rem;--space-20:5rem;--space-24:6rem;

  --color-bg:#f7f6f2;
  --color-surface:#f9f8f5;
  --color-surface-2:#fbfbf9;
  --color-surface-offset:#f3f0ec;
  --color-surface-offset-2:#edeae5;
  --color-surface-dynamic:#e6e4df;
  --color-divider:#dcd9d5;
  --color-border:#d4d1ca;
  --color-text:#28251d;
  --color-text-muted:#7a7974;
  --color-text-faint:#bab9b4;
  --color-text-inverse:#f9f8f4;
  --color-primary:#01696f;
  --color-primary-hover:#0c4e54;
  --color-primary-active:#0f3638;
  --color-primary-highlight:#cedcd8;
  --color-success:#437a22;
  --color-success-hover:#2e5c10;
  --color-success-highlight:#d4dfcc;
  --color-warning:#964219;
  --color-warning-highlight:#ddcfc6;
  --color-error:#a12c7b;
  --color-gold:#d19900;
  --color-gold-highlight:#e9e0c6;
  --color-blue:#006494;
  --color-blue-highlight:#c6d8e4;

  --radius-sm:0.375rem;--radius-md:0.5rem;--radius-lg:0.75rem;
  --radius-xl:1rem;--radius-2xl:1.5rem;--radius-full:9999px;
  --transition-interactive:180ms cubic-bezier(0.16, 1, 0.3, 1);
  --shadow-sm:0 1px 2px oklch(0.2 0.01 80 / 0.06);
  --shadow-md:0 4px 12px oklch(0.2 0.01 80 / 0.08);
  --shadow-lg:0 12px 32px oklch(0.2 0.01 80 / 0.12);

  --font-display: 'Cabinet Grotesk', 'Helvetica Neue', sans-serif;
  --font-body: 'Satoshi', 'Helvetica Neue', sans-serif;
  --content-narrow:640px;--content-default:960px;--content-wide:1200px;
}

/* IMPROVED DARK MODE CONTRAST */
[data-theme="dark"] {
  --color-bg:#12110f;
  --color-surface:#1c1b19;
  --color-surface-2:#242321;
  --color-surface-offset:#1d1c1a;
  --color-surface-offset-2:#22211f;
  --color-surface-dynamic:#2d2c2a;
  --color-divider:#2d2c2a;
  --color-border:#4a4945; /* Lightened from original for better definition */
  --color-text:#f0efed;   /* Brightened from original for better readability */
  --color-text-muted:#a19f9c; /* Brightened muted text */
  --color-text-faint:#757471;
  --color-text-inverse:#121110;
  --color-primary:#4f98a3;
  --color-primary-hover:#227f8b;
  --color-primary-active:#1a626b;
  --color-primary-highlight:#1f2b2b;
  --color-success:#6daa45;
  --color-success-hover:#4d8f25;
  --color-success-highlight:#252e21;
  --color-warning:#bb653b;
  --color-warning-highlight:#3b2d26;
  --color-error:#d163a7;
  --color-gold:#e8af34;
  --color-gold-highlight:#362e1e;
  --color-blue:#5591c7;
  --color-blue-highlight:#1e2730;
  --shadow-sm:0 1px 2px oklch(0 0 0 / 0.2);
  --shadow-md:0 4px 12px oklch(0 0 0 / 0.3);
  --shadow-lg:0 12px 32px oklch(0 0 0 / 0.4);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --color-bg:#12110f;--color-surface:#1c1b19;--color-text:#f0efed;--color-border:#4a4945;
  }
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;scroll-behavior:smooth;scroll-padding-top:80px}
body{min-height:100dvh;line-height:1.6;font-family:var(--font-body);font-size:var(--text-base);color:var(--color-text);background:var(--color-bg)}

/* FIX: Visually hide skip link but keep for screen readers */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border-width: 0;
}
.sr-only:focus {
  position: fixed;
  top: 1rem;
  left: 1rem;
  width: auto;
  height: auto;
  padding: 0.75rem 1.25rem;
  background: var(--color-primary);
  color: white;
  z-index: 1000;
  clip: auto;
  border-radius: var(--radius-md);
  font-weight: 700;
  text-decoration: none;
}

img,picture,video,canvas,svg{display:block;max-width:100%;height:auto}
input,button,textarea,select{font:inherit;color:inherit}
h1,h2,h3,h4,h5,h6{text-wrap:balance;line-height:1.15;font-family:var(--font-display)}
p,li{text-wrap:pretty}
button{cursor:pointer;background:none;border:none}
a,button,[role="button"],input,textarea,select{transition:color var(--transition-interactive),background var(--transition-interactive),border-color var(--transition-interactive),box-shadow var(--transition-interactive)}
::selection{background:oklch(from var(--color-primary) l c h / 0.2);color:var(--color-text)}
:focus-visible{outline:2px solid var(--color-primary);outline-offset:3px;border-radius:var(--radius-sm)}

/* ===== LAYOUT ===== */
.container{max-width:var(--content-wide);margin-inline:auto;padding-inline:var(--space-4)}
@media(min-width:768px){.container{padding-inline:var(--space-8)}}

/* ===== NAVBAR ===== */
.navbar{position:sticky;top:0;z-index:100;background:color-mix(in oklch,var(--color-surface) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid oklch(from var(--color-text) l c h / 0.08);padding-block:var(--space-3)}
.navbar-inner{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4)}
.logo{display:flex;align-items:center;gap:var(--space-2);text-decoration:none;color:var(--color-text)}
.logo-text{font-family:var(--font-display);font-weight:800;font-size:var(--text-lg);letter-spacing:-0.02em}
.logo-text span{color:var(--color-primary)}
.logo-text .logo-free{color:inherit}
.nav-links{display:flex;align-items:center;gap:var(--space-1)}
.nav-link{font-size:var(--text-sm);font-weight:500;color:var(--color-text-muted);text-decoration:none;padding:var(--space-2) var(--space-3);border-radius:var(--radius-md)}
.nav-link:hover{color:var(--color-text);background:var(--color-surface-offset)}
.nav-link.active{color:var(--color-primary);background:var(--color-primary-highlight)}
.nav-actions{display:flex;align-items:center;gap:var(--space-2)}
.theme-toggle{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:var(--radius-md);color:var(--color-text-muted)}
.theme-toggle:hover{background:var(--color-surface-offset);color:var(--color-text)}
.btn-share{display:flex;align-items:center;gap:var(--space-2);font-size:var(--text-sm);font-weight:600;padding:var(--space-2) var(--space-4);background:var(--color-primary);color:var(--color-text-inverse);border-radius:var(--radius-md)}
.btn-share:hover{background:var(--color-primary-hover)}
.mobile-menu-btn{display:none;align-items:center;justify-content:center;width:40px;height:40px;border-radius:var(--radius-md);color:var(--color-text-muted)}
@media(max-width:767px){
  .nav-links{display:none}.nav-links.open{display:flex;flex-direction:column;position:absolute;top:64px;left:0;right:0;background:var(--color-surface);border-bottom:1px solid var(--color-border);padding:var(--space-3);gap:var(--space-1);z-index:99}
  .nav-link{width:100%}
  .mobile-menu-btn{display:flex}
}

/* ===== HERO ===== */
.hero{padding:clamp(var(--space-4),2vw,var(--space-8)) 0 0;display:flex;flex-direction:column}
.hero-content{text-align:center;max-width:700px;margin-inline:auto;display:flex;flex-direction:column;align-items:center}
.hero-title{font-family:var(--font-display);font-size:var(--text-2xl);font-weight:800;letter-spacing:-0.03em;margin-bottom:var(--space-4)}
.hero-title em{color:var(--color-primary);font-style:normal}
.hero-subtitle{font-size:var(--text-base);color:var(--color-text-muted);max-width:55ch;margin-inline:auto;line-height:1.3}

.calc-nav{display:flex;flex-wrap:wrap;gap:var(--space-3);justify-content:center;margin-top:var(--space-8)}
.calc-nav-item{display:flex;align-items:center;gap:var(--space-2);font-size:var(--text-sm);font-weight:600;padding:var(--space-3) var(--space-5);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);color:var(--color-text-muted);cursor:pointer;text-decoration:none}
.calc-nav-item:hover{background:var(--color-surface-offset);color:var(--color-text);border-color:var(--color-primary)}
.calc-nav-item.active{background:var(--color-primary);color:var(--color-text-inverse);border-color:var(--color-primary)}
.nav-icon{width:18px;height:18px}

/* ===== CALCULATOR SECTION ===== */
.calc-section{display:none;padding-bottom:var(--space-16)}
.calc-section.active{display:block}
.calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-6);align-items:start}
@media(max-width:900px){.calc-grid{grid-template-columns:1fr}}

/* ===== CARD ===== */
.card{background:var(--color-surface);border:1px solid oklch(from var(--color-text) l c h / 0.08);border-radius:var(--radius-xl);padding:var(--space-6);box-shadow:var(--shadow-sm)}
.card-title{font-family:var(--font-display);font-size:var(--text-lg);font-weight:700;margin-bottom:var(--space-5)}
.card-title-row{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-5)}
.card-title-icon{width:36px;height:36px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card-title-icon svg{width:18px;height:18px}

/* ===== FORM ===== */
.form-group{margin-bottom:var(--space-4)}
.form-label{display:block;font-size:var(--text-sm);font-weight:600;color:var(--color-text-muted);margin-bottom:var(--space-2)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}
@media(max-width:500px){.form-row{grid-template-columns:1fr}}
.input-wrapper{position:relative;display:flex;align-items:center}
.input-prefix,.input-suffix{position:absolute;font-size:var(--text-sm);font-weight:600;color:var(--color-text-muted);pointer-events:none;user-select:none}
.input-prefix{left:var(--space-3)}
.input-suffix{right:var(--space-3)}
.form-input{width:100%;padding:var(--space-3) var(--space-4);background:var(--color-surface-2);border:1px solid var(--color-border);border-radius:var(--radius-md);font-size:var(--text-sm);color:var(--color-text)}
.form-input:focus{outline:none;border-color:var(--color-primary);box-shadow:0 0 0 3px oklch(from var(--color-primary) l c h / 0.12)}
.form-input.has-prefix{padding-left:var(--space-8)}
.form-input.has-suffix{padding-right:var(--space-8)}
.range-wrapper{display:flex;align-items:center;gap:var(--space-3)}
.range-input{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:var(--radius-full);background:var(--color-surface-dynamic);outline:none;cursor:pointer}
.range-input::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--color-primary);cursor:pointer;box-shadow:var(--shadow-sm)}
.range-input::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--color-primary);cursor:pointer;border:none}
.btn-primary{width:100%;padding:var(--space-3) var(--space-6);background:var(--color-primary);color:var(--color-text-inverse);border-radius:var(--radius-md);font-size:var(--text-base);font-weight:700;margin-top:var(--space-2);font-family:var(--font-display)}

/* ===== RESULTS ===== */
.results-card{background:var(--color-surface);border:1px solid oklch(from var(--color-text) l c h / 0.08);border-radius:var(--radius-xl);overflow:hidden;box-shadow:var(--shadow-sm)}
.results-header{background:var(--color-primary);color:var(--color-text-inverse);padding:var(--space-5) var(--space-6)}
.results-header h3{font-family:var(--font-display);font-size:var(--text-lg);font-weight:700;margin-bottom:var(--space-1)}
.results-kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--color-divider)}
.kpi{background:var(--color-surface);padding
